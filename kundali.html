<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroVedic Pro - Enter Portal</title>
    <style>
        :root {
            --primary: #4A154B;
            --secondary: #D4AF37;
            --dark: #1A1A2E;
            --light: #F9F9FB;
            --accent: #8E44AD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #2C1654 0%, #11071F 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing background stars effect */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--secondary), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: 1;
        }

        .intro-container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            font-size: 3.5rem;
            color: var(--secondary);
            margin-bottom: 1rem;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px var(--secondary)); }
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FFF, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #CBD5E1;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .enter-btn {
            background: linear-gradient(135deg, var(--secondary), #AA7C11);
            color: var(--dark);
            border: none;
            padding: 0.9rem 2.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            text-decoration: none;
            display: inline-block;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #F3C643, #D4AF37);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748B;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="intro-container">
        <div class="logo-icon">🕉️</div>
        <h1>AstroVedic Pro</h1>
        <p>Unlock the secrets of the cosmos. Generate authentic Vedic charts, precise planetary positions, and deep astrological insights tailored to your destiny.</p>
        <a href="kundali.html" class="enter-btn">Enter Generator</a>
        <div class="footer-note">Powered by Ancient Vedic Wisdom & Modern Technology</div>
    </div>

</body>
</html>
